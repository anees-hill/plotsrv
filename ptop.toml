# Receiver browsing: first reads, repeated reads, publication overlap, SSE,
# and independent page/status/plot probes. This always starts a local receiver.
[recipes.server-browser-concurrent]
description = "Concurrent visitors with table/artifact bursts, cheap probes and live updates"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m", "benchmarks.browser_profile",
  "--clients", "{clients}", "--rows", "{rows}", "--columns", "{columns}",
  "--string-chars", "{string_chars}", "--artifact-items", "{artifact_items}",
  "--rounds", "{rounds}", "--settle", "{settle}",
  "--max-server-rss-mb", "{max_server_rss_mb}", "--cheap-p95-ms", "{cheap_p95_ms}",
  "--output", "{output}",
]
defaults = { clients = "6", rows = "1680", columns = "12", string_chars = "8", artifact_items = "500", rounds = "5", settle = "22", max_server_rss_mb = "512", cheap_p95_ms = "0", output = "benchmark-results/{timestamp}-browser-{clients}-{rows}" }
interval = 0.1
max_tree_rss_mb = 1500
result_json = "{output}/ptop-result.json"
tags = { case = "server.browser.concurrent", clients = "{clients}", rows = "{rows}", columns = "{columns}", string_chars = "{string_chars}", artifact_items = "{artifact_items}", rounds = "{rounds}", settle = "{settle}" }
components = { server = 'pipeline_profile\.worker server', client = 'benchmarks\.browser_profile' }

