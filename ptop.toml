# Optional ptop helpers.  plotsrv's benchmark runner remains independently
# usable; these recipes only add durable process-resource history and comparison.

[recipes.watch-file-large-cycles]
description = "Large file-backed CSV visits with post-idle server memory checkpoints"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.pipeline_profile", "case", "run",
  "watch.csv.file.large.repeated-clients", "--profile", "{profile}",
  "--set", "cycles={cycles}", "--output", "{output}",
]
defaults = { profile = "standard", cycles = "4", output = "benchmark-results/{timestamp}-watch-file-cycles" }
interval = 0.5
max_tree_rss_mb = 1500
result_json = "{output}/ptop-result.json"
tags = { case = "watch.csv.file.large.repeated-clients", profile = "{profile}" }
components = { server = 'pipeline_profile\.worker server', client = 'pipeline_profile\.worker client' }

[recipes.watch-file-overload]
description = "Overload the file-backed admission limit; expected 503s are recorded, not treated as failures"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.pipeline_profile", "case", "run",
  "watch.csv.file.overload", "--profile", "{profile}", "--output", "{output}",
]
defaults = { profile = "standard", output = "benchmark-results/{timestamp}-watch-file-overload" }
interval = 0.5
max_tree_rss_mb = 1500
result_json = "{output}/ptop-result.json"
tags = { case = "watch.csv.file.overload", profile = "{profile}" }
components = { server = 'pipeline_profile\.worker server', client = 'pipeline_profile\.worker client' }

[recipes.publish-remote-sync]
description = "Reference remote synchronous publishing run"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.pipeline_profile", "case", "run",
  "publish.remote.sync.small", "--profile", "{profile}", "--output", "{output}",
]
defaults = { profile = "standard", output = "benchmark-results/{timestamp}-publish-sync" }
interval = 0.5
result_json = "{output}/ptop-result.json"
tags = { case = "publish.remote.sync.small", profile = "{profile}" }
components = { server = 'pipeline_profile\.worker server', pipeline = 'pipeline_profile\.worker pipeline' }

[recipes.publish-remote-async-high-frequency]
description = "High-frequency async publishing to stable view IDs"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.pipeline_profile", "case", "run",
  "publish.remote.async.latest-wins.high-frequency", "--profile", "{profile}", "--output", "{output}",
]
defaults = { profile = "standard", output = "benchmark-results/{timestamp}-publish-async" }
interval = 0.5
result_json = "{output}/ptop-result.json"
tags = { case = "publish.remote.async.latest-wins.high-frequency", profile = "{profile}" }
components = { server = 'pipeline_profile\.worker server', pipeline = 'pipeline_profile\.worker pipeline' }

# Final-release recipes.  These intentionally take longer than the standard
# recipes and are intended to be run from plotsrv-final-release.toml on a
# desktop-class machine before publishing a release.

[recipes.watch-file-release-soak]
description = "Release gate: repeated large file-backed CSV visits with long settling checks"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.pipeline_profile", "case", "run",
  "watch.csv.file.large.repeated-clients", "--profile", "{profile}",
  "--set", "cycles={cycles}", "--set", "clients={clients}",
  "--set", "requests_per_client={requests_per_client}",
  "--set", "table_limit={table_limit}", "--set", "cycle_idle_s={cycle_idle_s}",
  "--set", "idle_s={idle_s}", "--set", "max_rss_mb={max_rss_mb}",
  "--output", "{output}",
]
defaults = { profile = "soak", cycles = "24", clients = "9", requests_per_client = "3", table_limit = "20000", cycle_idle_s = "3", idle_s = "30", max_rss_mb = "6000", output = "benchmark-results/{timestamp}-release-watch-soak" }
interval = 0.5
max_tree_rss_mb = 6000
result_json = "{output}/ptop-result.json"
tags = { case = "watch.csv.file.large.repeated-clients", profile = "{profile}", release_gate = "file-settling" }
components = { server = 'pipeline_profile\.worker server', client = 'pipeline_profile\.worker client' }

[recipes.watch-file-release-overload]
description = "Release gate: extended overload/recovery test for watched-file admission"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.pipeline_profile", "case", "run",
  "watch.csv.file.overload", "--profile", "{profile}",
  "--set", "cycles={cycles}", "--set", "clients={clients}",
  "--set", "requests_per_client={requests_per_client}",
  "--set", "table_limit={table_limit}", "--set", "cycle_idle_s={cycle_idle_s}",
  "--set", "idle_s={idle_s}", "--output", "{output}",
]
defaults = { profile = "soak", cycles = "10", clients = "20", requests_per_client = "3", table_limit = "10000", cycle_idle_s = "2", idle_s = "20", output = "benchmark-results/{timestamp}-release-watch-overload" }
interval = 0.5
max_tree_rss_mb = 6000
result_json = "{output}/ptop-result.json"
tags = { case = "watch.csv.file.overload", profile = "{profile}", release_gate = "overload-recovery" }
components = { server = 'pipeline_profile\.worker server', client = 'pipeline_profile\.worker client' }

[recipes.publish-remote-sync-release]
description = "Release gate: repeated reference remote synchronous publishing"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
