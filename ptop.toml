description = "Fresh-process import plotsrv startup; useful for tracking lazy public imports"
command = [
  "uv", "run", "--group", "benchmark", "python", "-m",
  "benchmarks.cli_profile", "--mode", "import", "--repeats", "{repeats}",
  "--output", "{output}",
]
defaults = { repeats = "6", output = "benchmark-results/{timestamp}-cli-import" }
interval = 0.1
max_tree_rss_mb = 1500
result_json = "{output}/ptop-result.json"
tags = { case = "cli.import.cold-start", mode = "import" }
components = { cli = 'benchmarks\.cli_profile' }

