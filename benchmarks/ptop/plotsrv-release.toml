# ptop manifest
#
# Run it from this checkout with:
#   scripts/run_plotsrv_manifest.sh
#
schema_version = 1
name = "plotsrv 0.8.0 vs local checkout performance comparison"
output_root = "../../ptop-manifest-results"
baseline_target = "plotsrv_0_8_0"
continue_on_error = true

[targets.plotsrv_0_8_0]
package = "plotsrv==0.8.0"
harness = "../.."
packages = ["psutil>=5.9", "httpx>=0.28,<1"]

[targets.plotsrv_local]
source = "../.."
label = "plotsrv local checkout (development)"
harness = "../.."
packages = ["psutil>=5.9", "httpx>=0.28,<1"]

# Three independent ptop attempts per target are intentional.  Compare the
# medians in the manifest report rather than relying on one noisy run.
[[runs]]
recipe = "cli-import-cold-start"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3
set = { repeats = "6" }

[[runs]]
recipe = "cli-root-help-cold-start"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3
set = { repeats = "6" }

[[runs]]
recipe = "cli-bare-cold-start"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3
set = { repeats = "6" }

[[runs]]
recipe = "server-browser-concurrent"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3
set = { clients = "6" }

[[runs]]
recipe = "watch-file-large-cycles"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3
set = { profile = "standard", cycles = "12" }

[[runs]]
recipe = "watch-file-overload"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3

[[runs]]
recipe = "publish-remote-async-high-frequency"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3

[[runs]]
recipe = "cli-version-cold-start"
targets = ["plotsrv_0_8_0", "plotsrv_local"]
repeats = 3
set = { repeats = "6" }

