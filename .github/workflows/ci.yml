# .github/workflows/ci.yml
name: CI Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: uv sync --locked --group test

      - name: Install project
        run: uv pip install -e .

      - name: Install Chromium and browser dependencies
        run: uv run --locked python -m playwright install --with-deps chromium

      - name: Audit locked runtime dependencies
        if: matrix.python-version == '3.13'
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file /tmp/plotsrv-runtime-requirements.txt > /dev/null
          uvx --from pip-audit==2.10.1 pip-audit --disable-pip --no-deps -r /tmp/plotsrv-runtime-requirements.txt

      - name: Run tests
        run: uv run --locked pytest --benchmark-skip --cov=plotsrv --cov-report=xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
