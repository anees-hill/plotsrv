[project]
site_name = "plotsrv"
site_description = "See Python objects, tables, plots, and logs in your browser."
site_author = "Anees Hill"
site_url = "https://docs.plotsrv.com"

repo_name = "anees-hill/plotsrv"
repo_url = "https://github.com/anees-hill/plotsrv"
edit_uri = "edit/main/docs/"

copyright = """
Copyright &copy; 2026 Anees-Hill
"""

extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "Start here" = [
    { "Quick start" = "get-started/quick-start.md" },
    { "Use plotsrv in a project" = "get-started/use-in-a-project.md" },
    { "Watch files" = "get-started/watch-files.md" },
  ] },
  { "Guides" = [
    { "Publish from Python" = "guides/publish-from-python.md" },
    { "Explore in the browser" = "guides/explore-in-browser.md" },
    { "Follow logs and streams" = "guides/follow-logs-and-streams.md" },
    { "Keep history" = "guides/keep-history.md" },
    { "Observe function output" = "guides/observe-function-output.md" },
    { "Keep an eye on a job" = "guides/keep-an-eye-on-a-job.md" },
    { "Run plotsrv on another machine" = "guides/run-on-another-machine.md" },
    { "Configure plotsrv" = "guides/configure-plotsrv.md" },
  ] },
  { "Reference" = [
    { "Python API" = "reference/python-api.md" },
    { "CLI" = "reference/cli.md" },
    { "Configuration" = "reference/configuration.md" },
    { "Supported outputs and files" = "reference/supported-outputs-and-files.md" },
    { "Observation" = "reference/observation.md" },
    { "Remote publishing and security" = "reference/remote-publishing-and-security.md" },
  ] },
  { "Examples" = [
    { "ETL pipeline" = "examples/etl-pipeline.md" },
    { "EDA over SSH" = "examples/eda-on-a-server.md" },
  ] },
  { "Development" = [{ "Contributing" = "development/contributing.md" }] },
  { "Release notes" = "release-notes.md" },
]


[project.theme]
language = "en"
logo = "assets/images/brand/plotsrv_icon_logo.png"
favicon = "assets/images/brand/plotsrv_icon_logo.png"

features = [
  "content.code.copy",
  "content.code.select",
  "content.code.annotate",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"


# ----------------------------------------------------------------------------
# The "extra" section contains miscellaneous settings.
# ----------------------------------------------------------------------------
#[[project.extra.social]]
#icon = "fontawesome/brands/github"
#link = "https://github.com/user/repo"

# ----------------------------------------------------------------------------
# In this section you can configure the Markdown extensions that are used when
# rendering your documentation. We enable the most useful extensions by default,
# but you can customize this list to your needs.
#
# Read more:
# - https://zensical.org/docs/setup/extensions/
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.magiclink]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" }
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true
[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true
[project.markdown_extensions.pymdownx.tilde]
